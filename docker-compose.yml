services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — persistent storage for Lighthouse
  # Credentials are supplied via .env (never committed — see .env.example).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ta-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ta-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Caddy — TLS termination + reverse proxy
  # Handles Let's Encrypt certificate issuance/renewal automatically.
  # Requires ports 80 and 443 to be reachable from the internet.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: ta-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
      - caddy_logs:/var/log/caddy
    networks: [ta-net]
    depends_on:
      - lighthouse

  # ---------------------------------------------------------------------------
  # Lighthouse — OpenID Federation Trust Anchor (v0.20.x)
  # Config is read from ./lighthouse/config.yaml (mounted at /config.yaml).
  # Signing keys are persisted in ./lighthouse/data/signing on the host.
  # Storage is backed by PostgreSQL — LH_STORAGE_PASSWORD comes from .env.
  #
  # Port 7672: main server (proxied by Caddy — normal federation traffic).
  # Port 7673: Admin API — bound to loopback only; access via SSH tunnel:
  #   ssh -L 7673:localhost:7673 user@host
  #   then: curl http://localhost:7673/api/v1/admin/docs
  # ---------------------------------------------------------------------------
  lighthouse:
    image: oidfed/lighthouse:0.20.3
    container_name: ta-lighthouse
    restart: unless-stopped
    env_file: .env
    environment:
      LH_STORAGE_PASSWORD: "${LH_STORAGE_PASSWORD}"
    ports:
      - "127.0.0.1:7672:7672"
      - "127.0.0.1:7673:7673"
    volumes:
      - ./lighthouse/config.yaml:/config.yaml:ro
      - ./lighthouse/data/signing:/data/signing
    networks: [ta-net]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  caddy_logs:
  postgres_data:

networks:
  ta-net:
    name: ta-net
