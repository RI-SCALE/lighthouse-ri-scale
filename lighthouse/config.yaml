server:
  port: 7672
  # Lighthouse runs behind Caddy (reverse proxy), so TLS is terminated there.
  trusted_proxies:
    - "172.16.0.0/12"   # default Docker bridge range
    - "127.0.0.1/32"

logging:
  level: "info"

# Top-level entity_id (LightHouse 0.20.x).
# MUST be the exact public HTTPS URL.
entity_id: "https://CHANGE-ME.example.org"

signing:
  kms: filesystem
  # Public keys stored in the database (single source of truth, default).
  pk_backend: db
  auto_generate_keys: true
  filesystem:
    key_dir: "/data/signing"

storage:
  driver: postgres
  host: ta-postgres
  port: 5432
  user: lighthouse
  db: lighthouse
  # Password is NEVER stored in this file.
  # Pass it via LH_STORAGE_PASSWORD environment variable (set in .env).

# ---------------------------------------------------------------------------
# Admin API — served on a separate port (7673) so it can be network-isolated.
# Access via SSH tunnel only:
#   ssh -L 7673:localhost:7673 user@host
#   curl http://localhost:7673/api/v1/admin/docs  (Swagger UI)
# On first start, no authentication is required to create the first admin user.
# Once a user exists, all requests require HTTP Basic Authentication.
# ---------------------------------------------------------------------------
api:
  admin:
    enabled: true
    users_enabled: true
    port: 7673

# ---------------------------------------------------------------------------
# Statistics — enabled.
# Collects per-request metrics for all federation endpoints.
# ---------------------------------------------------------------------------
stats:
  enabled: true
  buffer:
    size: 10000
    flush_interval: "10s"
    flush_threshold: 0.8
  capture:
    client_ip: true
    user_agent: true
    query_params: true
  retention:
    detailed_days: 90
    aggregated_days: 365

endpoints:
  fetch:
    path: "/fetch"

  list:
    path: "/list"

  resolve:
    path: "/resolve"
    allowed_trust_anchors:
      - "https://CHANGE-ME.example.org"
    grace_period: "1h"
    time_elapsed_grace_factor: 0.75

  enroll_request:
    path: "/enroll-request"

  enroll:
    # Legacy admin enrollment path — kept for backward compatibility.
    # Prefer the Admin API (port 7673) for managing subordinates.
    # Caddy blocks this path from the public internet.
    path: "/enroll"
